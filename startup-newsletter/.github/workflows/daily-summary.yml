name: Daily Startup News Summary

on:
  schedule:
    # Runs at 23:00 UTC = 08:00 KST every day
    - cron: "0 23 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    # Two sequential Claude calls (summary + 16k-token trilingual) plus the
    # Notion upload routinely exceed 5 minutes; give the job room to finish.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CALENDAR_ID: ad3a712618285ba2a011179683b92bdc10718051482df8d950ccfb95a1f0aa19@group.calendar.google.com
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TIMEZONE: Asia/Seoul
        run: python main.py
