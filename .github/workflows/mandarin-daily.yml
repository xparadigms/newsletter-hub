name: Mandarin Basics — Daily Lesson
run-name: ${{ inputs.scheduled == 'true' && format('{0} (scheduled)', github.workflow) || github.workflow }}

# ISSUE_NUMBER: no prior repository, so github.run_number starts at 1 and needs
# no offset — unlike japan (45), watch (6) and startup (163).

on:
  # No `schedule:` here. GitHub started scheduled runs about two hours late,
  # so web/vercel.json's crons dispatch this workflow with scheduled=true
  # instead, and retry it later in the morning if it has not succeeded.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the site's cron: this is the day's regular issue"
        type: string
        default: ""
      edition:
        description: "2+ makes an extra issue for the day instead of replacing it"
        type: string
        default: ""


jobs:
  generate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mandarin-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      # The lesson runs on the Claude subscription through Claude Code when the
      # CLAUDE_CODE_OAUTH_TOKEN secret exists, and on the API key otherwise or
      # if the subscription call fails (shared/llm.py).
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily lesson
        # Supabase only: no Notion mirror and no calendar event. There is no news
        # to scrape either, so no feed credentials.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          TIMEZONE: Asia/Seoul
          EDITION: ${{ inputs.edition || '1' }}
          ISSUE_NUMBER: ${{ github.run_number }}
        run: python main.py
