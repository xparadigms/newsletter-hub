name: Rails — Daily Newsletter

on:
  schedule:
    # Runs at 23:00 UTC = 08:00 KST every day
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: "2+ makes an extra issue for the day instead of replacing it"
        type: string
        default: ""
      issue_number:
        description: "Reuse a number when re-running a day (blank = next)"
        type: string
        default: ""
      llm_model:
        description: "Override the model for one run (blank = gpt-6-astra)"
        type: string
        default: ""

jobs:
  generate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: finance-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run daily issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ inputs.llm_model }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GCP_TTS_API_KEY: ${{ secrets.GCP_TTS_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          CALENDAR_ID: ad3a712618285ba2a011179683b92bdc10718051482df8d950ccfb95a1f0aa19@group.calendar.google.com
          NOTION_DATABASE_ID: 3535bc953df3807b83c9dc5be40b72e6
          TIMEZONE: Asia/Seoul
          EDITION: ${{ inputs.edition || '1' }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.run_number }}
        run: python main.py
