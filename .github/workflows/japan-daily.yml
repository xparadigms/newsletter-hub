name: Japan Daily Talk — Daily Newsletter
run-name: ${{ inputs.scheduled == 'true' && format('{0} (scheduled)', github.workflow) || github.workflow }}

# ISSUE_NUMBER continuity: this workflow file is new, so github.run_number
# restarts at 1. The last issue published before the migration was #11
# (2026-08-17). The offset started at 11 to make the first run #12; run 4 was a
# dry run that published nothing but still consumed a number, so the offset
# drops by one to keep the published sequence contiguous. Any future dry run
# needs the same adjustment.

on:
  # No `schedule:` here. GitHub started scheduled runs about two hours late,
  # so web/vercel.json's crons dispatch this workflow with scheduled=true
  # instead, and retry it later in the morning if it has not succeeded.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the site's cron: this is the day's regular issue"
        type: string
        default: ""
      edition:
        description: "2+ makes an extra issue for the day instead of replacing it"
        type: string
        default: ""
      dry_run:
        description: "Print the issue and publish nothing"
        type: boolean
        default: false
      issue_number:
        description: "Reuse a number when re-running a day (blank = next)"
        type: string
        default: ""

jobs:
  generate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: japan-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run daily issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          CALENDAR_ID: ad3a712618285ba2a011179683b92bdc10718051482df8d950ccfb95a1f0aa19@group.calendar.google.com
          NOTION_DATABASE_ID: 36a5bc953df38036acb4d2b6553e582c
          TIMEZONE: Asia/Seoul
          EDITION: ${{ inputs.edition || '1' }}
          ISSUE_NUMBER_OFFSET: "10"
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          NUM="${{ inputs.issue_number }}"
          if [ -z "$NUM" ]; then NUM=$((GITHUB_RUN_NUMBER + ISSUE_NUMBER_OFFSET)); fi
          ISSUE_NUMBER=$NUM python main.py $ARGS
