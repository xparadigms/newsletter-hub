name: Japan Briefing — Daily Newsletter

# NOTE: this newsletter is intentionally PAUSED.
# The schedule trigger below is commented out on purpose so that adding this
# workflow to the monorepo does not silently resume daily posting. Use the
# manual trigger to run it on demand. To resume the daily schedule, uncomment
# the two `schedule` lines.
#
# ISSUE_NUMBER continuity: this workflow file is new, so github.run_number
# restarts at 1. The old japan-newsletter repo reached run 45, so the offset
# below keeps issue numbering continuous.

on:
  # schedule:
  #   - cron: "10 23 * * *" # 23:10 UTC = 08:10 KST, staggered after Rails
  workflow_dispatch: # Manual trigger only while paused

jobs:
  generate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: japan-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run daily issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GCP_TTS_API_KEY: ${{ secrets.GCP_TTS_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          CALENDAR_ID: ad3a712618285ba2a011179683b92bdc10718051482df8d950ccfb95a1f0aa19@group.calendar.google.com
          NOTION_DATABASE_ID: 36a5bc953df38036acb4d2b6553e582c
          TIMEZONE: Asia/Seoul
          ISSUE_NUMBER_OFFSET: "45"
        run: ISSUE_NUMBER=$((GITHUB_RUN_NUMBER + ISSUE_NUMBER_OFFSET)) python main.py
