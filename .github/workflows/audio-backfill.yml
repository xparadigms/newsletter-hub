name: Voice issues published without audio

# Manual: voices every sentence that has no clip in issues since a date, and
# writes the blocks back. Safe to rerun. See shared/backfill_audio.py.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "First issue date to check, YYYY-MM-DD"
        type: string
      dry_run:
        description: "List the issues and write nothing"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SINCE: ${{ inputs.since }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m shared.backfill_audio --since "$SINCE" $ARGS
