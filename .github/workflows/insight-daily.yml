name: Business Insight — Daily Newsletter

# ISSUE_NUMBER: a new newsletter, so github.run_number starts at 1 and needs no
# offset — unlike japan (10), watch (6) and startup (163).

on:
  schedule:
    # 22:30 UTC = 07:30 KST, between china at 22:00 and the 23:00 group.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the issue and publish nothing"
        type: boolean
        default: false
      issue_number:
        description: "Reuse a number when re-running a day (blank = next)"
        type: string
        default: ""

jobs:
  generate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: insight-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run daily issue
        # Supabase only: no Notion mirror and no calendar event, like mandarin.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GCP_TTS_API_KEY: ${{ secrets.GCP_TTS_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          TIMEZONE: Asia/Seoul
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          NUM="${{ inputs.issue_number }}"
          if [ -z "$NUM" ]; then NUM=$GITHUB_RUN_NUMBER; fi
          ISSUE_NUMBER=$NUM python main.py $ARGS
