name: Daily Startup News Summary
run-name: ${{ inputs.scheduled == 'true' && format('{0} (scheduled)', github.workflow) || github.workflow }}

# ISSUE_NUMBER continuity: the old startup-techcrunch-summary repo never passed
# ISSUE_NUMBER, so main.py fell back to its default of 1 and every issue was
# titled "[Startup News #1]". That repo reached run 163, so the offset below
# both fixes the numbering and continues from where the run count left off.

on:
  # No `schedule:` here. GitHub started scheduled runs about two hours late,
  # so web/vercel.json's crons dispatch this workflow with scheduled=true
  # instead, and retry it later in the morning if it has not succeeded.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the site's cron: this is the day's regular issue"
        type: string
        default: ""
      edition:
        description: "2+ makes an extra issue for the day instead of replacing it"
        type: string
        default: ""
      issue_number:
        description: "Reuse a number when re-running a day (blank = next)"
        type: string
        default: ""
      llm_model:
        description: "Override the model for one run (blank = claude-sonnet-4-6)"
        type: string
        default: ""

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    # Two sequential Claude calls (summary + 16k-token trilingual) plus the
    # Notion upload routinely exceed 5 minutes; give the job room to finish.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: startup-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      # Claude calls run on the Claude subscription through Claude Code, and on
      # the API key if that fails (shared/llm.py).
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ inputs.llm_model }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          CALENDAR_ID: ad3a712618285ba2a011179683b92bdc10718051482df8d950ccfb95a1f0aa19@group.calendar.google.com
          NOTION_DATABASE_ID: 3555bc953df380e2ae70df4401216aee
          TIMEZONE: Asia/Seoul
          EDITION: ${{ inputs.edition || '1' }}
          ISSUE_NUMBER_OFFSET: "163"
        run: |
          NUM="${{ inputs.issue_number }}"
          if [ -z "$NUM" ]; then NUM=$((GITHUB_RUN_NUMBER + ISSUE_NUMBER_OFFSET)); fi
          ISSUE_NUMBER=$NUM python main.py
