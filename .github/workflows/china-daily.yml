name: China Daily — Newsletter

# ISSUE_NUMBER: there is no prior repository for this newsletter, so
# github.run_number starts at 1 and needs no offset — unlike japan (45),
# watch (6) and startup (163).

on:
  schedule:
    # 22:00 UTC = 07:00 KST, ahead of the 23:00 / 23:10 / 23:20 stagger that
    # keeps the Anthropic-heavy jobs from overlapping.
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  generate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: china-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run daily issue
        # Supabase-only: no NOTION_TOKEN, no NOTION_DATABASE_ID, no GCP_SA_KEY
        # and no CALENDAR_ID, because this newsletter has no Notion mirror and
        # creates no calendar event.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          TIMEZONE: Asia/Seoul
          ISSUE_NUMBER: ${{ github.run_number }}
        run: python main.py
