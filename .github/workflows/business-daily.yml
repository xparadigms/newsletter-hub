name: Business Insight — Daily Newsletter
run-name: ${{ inputs.scheduled == 'true' && format('{0} (scheduled)', github.workflow) || github.workflow }}

# ISSUE_NUMBER: a new newsletter, so github.run_number starts at 1 and needs no
# offset — unlike japan (10), watch (6) and startup (163).

on:
  # No `schedule:` here. GitHub started scheduled runs about two hours late,
  # so web/vercel.json's crons dispatch this workflow with scheduled=true
  # instead, and retry it later in the morning if it has not succeeded.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the site's cron: this is the day's regular issue"
        type: string
        default: ""
      edition:
        description: "2+ makes an extra issue for the day instead of replacing it"
        type: string
        default: ""
      dry_run:
        description: "Print the issue and publish nothing"
        type: boolean
        default: false
      issue_number:
        description: "Reuse a number when re-running a day (blank = next)"
        type: string
        default: ""

jobs:
  generate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: business-newsletter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run daily issue
        # Supabase only: no Notion mirror and no calendar event, like mandarin.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          TIMEZONE: Asia/Seoul
          EDITION: ${{ inputs.edition || '1' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          NUM="${{ inputs.issue_number }}"
          if [ -z "$NUM" ]; then NUM=$GITHUB_RUN_NUMBER; fi
          ISSUE_NUMBER=$NUM python main.py $ARGS
