name: iOS app

# Builds the app on GitHub's Macs on every push that touches it, so a compile
# error shows up here rather than on someone's laptop. On main, with the App
# Store Connect key in the repo's secrets, the build also goes to TestFlight —
# no Mac needed. Run it by hand from the Actions tab to upload on demand.
#
# Two secrets: SUPABASE_PUBLISHABLE_KEY, the database's read key, which is kept
# out of the public source; and ASC_KEY_P8, the contents of the App Store
# Connect API key file (AuthKey_42Z98QR7J4.p8). The key's ID, its issuer and the team are not
# secrets — they identify the key, they cannot sign with it — so they sit below.

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest released Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        working-directory: ios
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p build
          python3 generate_project.py
          xcodebuild -project TheBrief.xcodeproj -scheme TheBrief -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" build 2>&1 | tee build/build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          grep -q "BUILD SUCCEEDED" build/build.log

      # The App Store certificate and profile (kept as secrets) go into a
      # throwaway keychain, so the archive is signed for the App Store with
      # the push entitlement from the start.
      - name: Install signing certificate and profile
        if: env.HAS_KEY == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(openssl rand -hex 12)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Name raw -)" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC" | head -3

      - name: Upload to TestFlight
        if: env.HAS_KEY == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ASC_KEY_ID: 42Z98QR7J4
          ASC_ISSUER_ID: 4b0444d7-b87e-4112-8b16-653ff28b5bb9
          TEAM_ID: N7DWY66V6B
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          export BUILD=$(date -u +%Y%m%d%H%M)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          ios/scripts/testflight.sh || { tail -60 ios/build/archive.log 2>/dev/null; exit 1; }

      # Internal testers get every build on their own; the external "Testers"
      # group has to be given each one, after Apple has processed it.
      - name: Share with external testers
        if: env.HAS_KEY == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 42Z98QR7J4
          ASC_ISSUER_ID: 4b0444d7-b87e-4112-8b16-653ff28b5bb9
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography requests || pip3 install --quiet pyjwt cryptography requests
          python3 ios/scripts/asc_testers.py share "$BUILD"
